server:
  port: 9999
spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "*"
                allowedMethods: "*"
                allowedHeaders: "*"
          routes:
            - id: r1
              uri: ${CUSTOMER_SERVICE_URL:http://localhost:8056}
              predicates:
                - Path=/customers/**
            - id: r2
              uri: ${EBANK_SERVICE_URL:http://localhost:8057}
              predicates:
                - Path=/accounts/**